# Keyless CI. No secrets, no Azure, no Docker services:
# the pandas/numpy side is tested with SQLite + in-memory fakes, the Spark side with a
# local SparkSession on the runner's Java.
# The live copy is .github/workflows/ci.yml; keep the two files identical.
name: ci

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Generated DDL matches the committed SQL file
        run: |
          python -m olistpipe ddl > /tmp/ddl.sql
          diff -u -B sql/mysql/02_olist_tables.sql /tmp/ddl.sql
      - name: Unit tests (Spark tests skip themselves without pyspark)
        run: python -m pytest tests --ignore=tests/spark -q

  spark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install "pyspark==3.5.3" pandas pyarrow pytest
      - name: Spark transform and data quality tests
        run: python -m pytest tests/spark -q
